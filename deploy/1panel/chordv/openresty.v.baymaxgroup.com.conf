# openresty (TLS terminator) → chordv-admin container.
#
# The admin container (127.0.0.1:3002) now serves the static admin bundle out of
# the current release AND reverse-proxies /api to chordv-api, so this front proxy
# just forwards everything to it. openresty terminates TLS, so it sends
# X-Forwarded-Proto=https; the admin container preserves it to the api, which
# enforces HTTPS-only in production.
#
# (Previously this served /opt/apps/chordv/admin-dist directly and proxied /api to
# 127.0.0.1:3001 — that bypassed the admin container and pinned the UI to a stale
# static bundle that could not follow backend self-updates.)
server {
    listen 80;
    listen [::]:80;
    server_name v.baymaxgroup.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # Forward SSE events immediately across every proxy hop.
        proxy_buffering off;
        client_max_body_size 1024m;
    }
}
