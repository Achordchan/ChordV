# Admin static site + /api reverse proxy to the api container.
# Web root is a symlink maintained by admin-entrypoint.sh, re-pointed on self-update.

# Preserve the proto set by the upstream TLS terminator (openresty sends https),
# falling back to this hop's scheme. The api enforces HTTPS-only in production and
# reads X-Forwarded-Proto, so clobbering it with $scheme would 426 every request.
map $http_x_forwarded_proto $chordv_fwd_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/current;
    index index.html;

    # nginx must re-resolve the root symlink after the entrypoint flips it.
    disable_symlinks off;

    location /api/ {
        proxy_pass ${CHORDV_API_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $chordv_fwd_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 1024m;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
