name: Agent (Go)

# Checks for apps/agent, the Go port of the node agent (docs/prd/
# node-inband-coexist-go-agent.md §5.1). It is a separate module from the pnpm
# workspace, so nothing in the existing pipelines covers it.

on:
  push:
    branches: [main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-go.yml"
  pull_request:
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-go.yml"

concurrency:
  group: agent-go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The dependency set is the whole reason this agent can be a single static
      # binary; an untidy or unverified one is how that quietly stops being true.
      - name: Modules verified and tidy
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod / go.sum 未 tidy，请在本地运行 go mod tidy 后提交：" >&2
            git --no-pager diff -- go.mod go.sum >&2
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      # The whole point of choosing Go was a single binary with no runtime on the
      # target VPS. CGO_ENABLED=0 is what delivers that, so it is verified for
      # both architectures the control plane accepts at registration rather than
      # discovered at install time on someone's arm64 box.
      - name: Cross compile (static, both accepted architectures)
        run: |
          for arch in amd64 arm64; do
            echo "== linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build ./...
          done
