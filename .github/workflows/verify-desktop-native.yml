name: Verify MyGo Desktop

on:
  pull_request:
    paths:
      - "packages/release-protocol/**"
      - "apps/desktop/**"
      - "packages/shared/**"
      - "scripts/mygo-*"
      - ".github/scripts/**"
      - ".github/runtime-components.lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-desktop-native.yml"
      - ".github/workflows/verify-ui.yml"
      - "tests/e2e/fixtures/windows-legacy/**"
      - "tests/e2e/runtime-ui-*"
      - "apps/server/internal/api/client.go"
      - "start-app.sh"
      - ".github/workflows/release-desktop.yml"
  push:
    branches: [main]
    paths:
      - "packages/release-protocol/**"
      - "apps/desktop/**"
      - "packages/shared/**"
      - "scripts/mygo-*"
      - ".github/scripts/**"
      - ".github/runtime-components.lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-desktop-native.yml"
      - ".github/workflows/verify-ui.yml"
      - "tests/e2e/fixtures/windows-legacy/**"
      - "tests/e2e/runtime-ui-*"
      - "apps/server/internal/api/client.go"
      - "start-app.sh"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: desktop-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ui:
    uses: ./.github/workflows/verify-ui.yml
  linux-dconf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/native/go.mod
          cache-dependency-path: apps/desktop/native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated session tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin dconf-gsettings-backend dconf-service dbus-daemon dbus-bin gsettings-desktop-schemas glib-networking gcc pkg-config libglib2.0-dev unzip
      - name: Prepare verified official Linux test assets and system GIO consumer
        run: |
          node scripts/mygo-linux-runtime-fixtures.mjs --arch x64 --output "$RUNNER_TEMP/chordv-linux-runtime"
          gcc -Wall -Wextra -Werror apps/desktop/native/testdata/gnome_proxy_probe.c -o "$RUNNER_TEMP/chordv-linux-runtime/gio-probe" $(pkg-config --cflags --libs gio-2.0)
      - name: Verify genuine Xray traffic, default GIO discovery and independent watchdog
        working-directory: apps/desktop/native
        env:
          CHORDV_TEST_ISOLATED_DCONF: "1"
          CHORDV_TEST_GNOME_SCHEMA_DIR: /usr/share/glib-2.0/schemas
          CHORDV_TEST_XRAY_DIR: ${{ runner.temp }}/chordv-linux-runtime/assets
          CHORDV_TEST_GIO_PROBE: ${{ runner.temp }}/chordv-linux-runtime/gio-probe
        run: |
          test -x "$CHORDV_TEST_XRAY_DIR/xray"
          test -x "$CHORDV_TEST_GIO_PROBE"
          set -o pipefail
          go test -race -count=1 -run '^TestLinuxDconf|^TestLinuxGNOME|^TestGNOME' -json ./... | tee "$RUNNER_TEMP/chordv-linux-runtime/tests.jsonl"
          node ../../../scripts/mygo-linux-runtime-fixtures.mjs --verify-test-log "$RUNNER_TEMP/chordv-linux-runtime/tests.jsonl"
          go vet ./...
  verify:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            architecture: arm64
            goarch: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            goarch: amd64
          - runner: windows-2022
            platform: windows
            architecture: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/native/go.mod
          cache-dependency-path: apps/desktop/native/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Verify shared release binding protocol
        working-directory: packages/release-protocol
        run: go test -race ./... && go vet ./...
      - name: Verify macOS recovery signing and test gate without release credentials
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mac-recovery-signing.tap"
          node --test --test-reporter=tap scripts/mygo-macos-recovery-signing.test.mjs scripts/mygo-verify-mac-recovery-log.test.mjs | tee "$log"
          test "$(grep '^# skipped ' "$log")" = '# skipped 0'
      - name: Generate bridge and verify native code
        working-directory: apps/desktop/native
        run: |
          set -euo pipefail
          go tool mygo generate
          if [ '${{ matrix.platform }}' = macos ]; then
            log="$RUNNER_TEMP/mac-native-recovery.jsonl"
            go test -race -count=1 -timeout=30m -json ./... | tee "$log"
            node ../../../scripts/mygo-verify-mac-recovery-log.mjs "$log"
          else
            go test -race ./...
          fi
          go vet ./...
          go mod verify
      - name: Check React frontend without old Rust/Node service
        run: |
          pnpm --filter @chordv/shared build
          pnpm --filter @chordv/desktop check
      - name: Build isolated local MyGo installer
        env:
          CHORDV_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/mygo-desktop.mjs --build-only --platform '${{ matrix.platform }}' --arch '${{ matrix.architecture }}'
      - name: Start the verified Windows x64 payload in read-only build-info mode
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        env:
          CHORDV_BUILD_NUMBER: ${{ github.run_number }}
        run: node .github/scripts/windows-local-build-smoke.mjs
      - name: Prepare matching macOS runtime fixtures
        if: matrix.platform == 'macos'
        run: node scripts/mygo-mac-runtime-fixtures.mjs "$RUNNER_TEMP/mac-runtime" '${{ matrix.architecture }}'
      - name: Verify isolated desktop runtime assets without a Tauri checkout
        if: matrix.platform == 'macos'
        run: |
          runtime_dir=$(cd "$RUNNER_TEMP/mac-runtime" && pwd -P)
          CHORDV_TEST_XRAY_DIR="$runtime_dir" node --test tests/e2e/runtime-ui-isolation.test.mjs
      - name: Exercise packaged macOS update and isolated real Xray connections
        if: matrix.platform == 'macos'
        working-directory: apps/desktop/native
        env:
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          CHORDV_TEST_XRAY_DIR: ${{ runner.temp }}/mac-runtime
          CHORDV_TEST_FULL_GUI_APP: ${{ github.workspace }}/output/mygo/darwin-${{ matrix.goarch }}/ChordV MyGo Local.app
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          case "$EXPECTED_GOARCH:$(uname -m)" in arm64:arm64|amd64:x86_64) ;; *) exit 1 ;; esac
          test "$(sysctl -in sysctl.proc_translated)" != 1
          test -d "$CHORDV_TEST_FULL_GUI_APP"
          images=( "$(dirname "$CHORDV_TEST_FULL_GUI_APP")"/*.dmg )
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          export CHORDV_TEST_FULL_GUI_DMG="${images[0]}"
          node --test ../../../.github/scripts/desktop-build-info.test.mjs
          log="$RUNNER_TEMP/mac-packaged-update.jsonl"
          go test -race -tags=e2e -count=1 -timeout=10m -run '^(TestMacLockedXrayRealityHTTPAndSOCKSLifecycle|TestMacUpdate(PackagedChordVGUIReadyWithoutNetwork|Schema2PackagedGUIAndPhaseTampering))$' -json . | tee "$log"
          python3 - "$log" <<'PYTHON'
          import json, sys
          package = "github.com/Achordchan/ChordV/apps/desktop/native"
          parent = "TestMacUpdateSchema2PackagedGUIAndPhaseTampering"
          required = {"TestMacLockedXrayRealityHTTPAndSOCKSLifecycle", "TestMacUpdatePackagedChordVGUIReadyWithoutNetwork", parent,
                      *(parent + "/" + phase for phase in ("healthy", "prepared-raw-signature", "armed-git-history"))}
          with open(sys.argv[1], encoding="utf-8") as log:
              events = [row for line in log if (row := json.loads(line)).get("Package") == package]
          passed = {row.get("Test") for row in events if row["Action"] == "pass"}
          if any(row["Action"] in ("skip", "fail") for row in events) or None not in passed or required - passed:
              sys.exit(f"Packaged macOS update tests incomplete; missing passes: {sorted(required - passed)}")
          PYTHON
      - name: Cross-compile other desktop architectures
        if: matrix.runner != 'macos-15-intel'
        working-directory: apps/desktop/native
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$RUNNER_TEMP/chordv-${os}-${arch}" .
          done
