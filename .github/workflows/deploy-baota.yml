name: Deploy Baota (DEPRECATED)

# DEPRECATED / 已停用自动触发。
# 后台系统已迁移到 1Panel Docker 容器 + 应用内一键自更新，发布走 release-backend.yml。
# 见 docs/prd/backend-self-update.md 与 README「部署说明」。
# 这里移除了 push 自动触发，仅保留手动 workflow_dispatch 作为迁移期兜底；
# 确认容器部署稳定后，可连同 scripts/deploy-baota.sh 一并删除。
on:
  workflow_dispatch:

concurrency:
  group: chordv-api-baota-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API regression tests
        run: pnpm test:api

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BAOTA_SSH_KEY }}" > ~/.ssh/baota_deploy
          chmod 600 ~/.ssh/baota_deploy
          ssh-keyscan -H "${{ secrets.BAOTA_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.BAOTA_HOST }}
          DEPLOY_USER: ${{ secrets.BAOTA_USER }}
          DEPLOY_PATH: /www/wwwroot/v.baymaxgroup.com
          DEPLOY_ADMIN_PATH: /www/v.baymaxgroup.com
          DEPLOY_PROJECT: chordv_api
          DEPLOY_NODE_VERSION: v20.19.0
          DEPLOY_DOMAIN: v.baymaxgroup.com
          DEPLOY_PORT: "3001"
          DEPLOY_HEALTH_PATH: /api/client/version
          DEPLOY_ALLOW_ROOT: ${{ secrets.BAOTA_ALLOW_ROOT }}
          DEPLOY_RUN_DB_PUSH: ${{ secrets.BAOTA_RUN_DB_PUSH || 'false' }}
          SSH_OPTS: -i ~/.ssh/baota_deploy -o StrictHostKeyChecking=yes
        run: bash scripts/deploy-baota.sh
