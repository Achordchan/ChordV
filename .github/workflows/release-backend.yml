name: Release Go Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "服务端版本，必须与 SYSTEM_VERSION 一致"
        required: true
        type: string
      changelog:
        description: "更新说明，每行一条"
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: chordv-server-release
  cancel-in-progress: false

env:
  RELEASE_TAG_BINDING: signed-manifest-tree
  VITE_GITHUB_RELEASE_REPOSITORY: ${{ vars.CHORDV_RELEASE_REPOSITORY }}
  VITE_GITHUB_RELEASE_PUBLIC_KEY: ${{ vars.CHORDV_RELEASE_PUBLIC_KEY }}
  CHORDV_BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_KIND: server

jobs:
  agent-tests:
    uses: ./.github/workflows/agent-go.yml
  admin-ui:
    uses: ./.github/workflows/verify-ui.yml
    with:
      admin: true
  server-tests:
    uses: ./.github/workflows/verify-server-database.yml
  build:
    needs: [server-tests, admin-ui, agent-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.configuration.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/agent/go.sum
      - name: Verify explicit version and publication configuration
        id: configuration
        run: |
          node --input-type=module <<'JS'
          import { checkedVersion, checkedRepository } from './.github/scripts/release-artifacts.mjs';
          import { releasePublicKey } from './.github/scripts/release-public-key.mjs';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = checkedVersion(process.env.VERSION);
          checkedRepository(process.env.VITE_GITHUB_RELEASE_REPOSITORY);
          if (readFileSync('SYSTEM_VERSION', 'utf8').trim() !== version) throw new Error('SYSTEM_VERSION mismatch');
          releasePublicKey(process.env.VITE_GITHUB_RELEASE_PUBLIC_KEY);
          appendFileSync(process.env.GITHUB_ENV, `VERSION=${version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: pnpm install --frozen-lockfile
      - name: Verify release packaging and actual binary metadata without publishing
        run: node --test .github/scripts/*.test.mjs
      - name: Verify shared release binding protocol
        working-directory: packages/release-protocol
        run: go test -race ./... && go vet ./...
      - name: Build relocatable Go binary and management frontend
        run: node scripts/mygo-build-backend.mjs --release --platform linux --arch '${{ matrix.architecture }}'
      - name: Stage actual server archive and metadata
        run: node .github/scripts/release-artifacts.mjs stage-server linux '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  verify-archives:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      staged_digest: ${{ steps.digest.outputs.value }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chordv_local
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: chordv_mygo_local
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chordv_local -d chordv_mygo_local"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: server-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify actual staged archives and Agent downloads before signing
        env:
          CHORDV_LOCAL_DATABASE_URL: postgresql://chordv_local:local-ci-only@127.0.0.1:5432/chordv_mygo_local?sslmode=disable
        run: node scripts/mygo-agent-distribution-e2e.mjs --staged
      - name: Verify release recovery with the actual archives over loopback
        env:
          CHORDV_TEST_SERVER_RELEASE_DIR: release-assets
        run: node --test .github/scripts/server-release-recovery.test.mjs
      - name: Record exact tested release inputs
        id: digest
        working-directory: release-assets
        run: |
          set -euo pipefail
          digest=$(sha256sum -- * | sha256sum | cut -d' ' -f1)
          echo "value=$digest" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, verify-archives]
    runs-on: ubuntu-latest
    environment: github-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: server-linux-*
          path: release-assets
          merge-multiple: true
      - name: Require the same files tested by the archive gate
        working-directory: release-assets
        env:
          EXPECTED: ${{ needs.verify-archives.outputs.staged_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum -- * | sha256sum | cut -d' ' -f1)" = "$EXPECTED"
      - name: Sign server manifest with actual server archives
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          CHORDV_RELEASE_SIGNING_KEY: ${{ secrets.CHORDV_RELEASE_SIGNING_KEY }}
        run: node .github/scripts/release-artifacts.mjs manifest
      - name: Create exact signed recovery bundle
        id: recovery
        run: node .github/scripts/release-recovery-bundle.mjs
      - name: Persist exact signed recovery bundle before publishing
        uses: actions/upload-artifact@v4
        with:
          name: server-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.recovery.outputs.bundle_path }}
          if-no-files-found: error
          compression-level: 0
      - name: Publish server GitHub Release only
        env:
          CHORDV_RELEASE_REPOSITORY: ${{ vars.CHORDV_RELEASE_REPOSITORY }}
          CHORDV_RELEASE_TOKEN: ${{ secrets.CHORDV_RELEASE_TOKEN }}
        run: node .github/scripts/publish-github-release.mjs
