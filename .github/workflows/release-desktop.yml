name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，不带 v，例如 1.1.7"
        required: true
        default: "1.1.7"
        type: string

concurrency:
  group: chordv-desktop-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${RAW_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_path: output/release/macos/*.dmg
          - platform: windows
            runner: windows-2022
            rust_targets: x86_64-pc-windows-msvc
            artifact_path: |
              output/release/windows/*.exe
              output/release/windows/*.zip
    defaults:
      run:
        shell: bash
    env:
      CHORDV_PUBLIC_BASE_URL: https://v.baymaxgroup.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version matches input
        run: node apps/desktop/scripts/check-version-consistency.mjs "${{ needs.prepare.outputs.version }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install cargo-xwin
        if: matrix.platform == 'windows'
        run: cargo install cargo-xwin --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust lockfile
        run: pnpm --filter @chordv/desktop exec cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Build shared package
        run: pnpm --filter @chordv/shared build

      - name: Build desktop bundle
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pnpm --filter @chordv/desktop exec node ./scripts/build-tauri-platform.mjs windows --target x86_64-pc-windows-msvc
          else
            pnpm --filter @chordv/desktop exec node ./scripts/build-tauri-platform.mjs macos
          fi

      - name: Verify Windows bundle
        if: matrix.platform == 'windows'
        run: pnpm --filter @chordv/desktop check:windows-bundle

      - name: Verify macOS bundle
        if: matrix.platform == 'macos'
        run: pnpm --filter @chordv/desktop check:macos-bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ChordV ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.zip
