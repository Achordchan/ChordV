name: Verify Go Release Pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/release-*.yml"
      - ".github/workflows/verify-server-database.yml"
      - ".github/workflows/verify-ui.yml"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "SYSTEM_VERSION"
      - "apps/agent/**"
      - ".github/scripts/**"
      - ".github/runtime-components.lock.json"
      - "packages/release-protocol/**"
      - "apps/server/**"
      - "apps/admin/**"
      - "scripts/mygo-*"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ui:
    uses: ./.github/workflows/verify-ui.yml
    with:
      admin: true
  server-tests:
    uses: ./.github/workflows/verify-server-database.yml
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Verify shared release binding protocol
        working-directory: packages/release-protocol
        run: go test -race ./... && go vet ./...
      - name: Verify GitHub protocol, integrity, signatures and immutable publishing
        run: node --test .github/scripts/*.test.mjs
      - run: pnpm --filter @chordv/shared build
      - name: Build server distribution without deployment
        run: node scripts/mygo-build-backend.mjs --platform linux --arch x64
