name = "chordv-subscription"
main = "src/worker.mjs"
compatibility_date = "2025-06-01"

# Serve only on the subscription domain(s); the *.workers.dev address stays off.
workers_dev = false
# routes = [
#   { pattern = "sub.example.com", custom_domain = true }
# ]

# The namespace the ChordV API publishes into (CHORDV_SUBSCRIPTION_KV_NAMESPACE_ID).
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Request logs would record every link, and a link is a credential.
[observability]
enabled = false
